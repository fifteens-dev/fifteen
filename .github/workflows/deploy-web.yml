name: Deploy to GitHub Pages

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3

    - name: Setup Flutter
      uses: subosito/flutter-action@v2
      with:
        flutter-version: '3.x'
        channel: 'stable'

    - name: Create .env file
      run: |
        cat > .env << EOF
        # Spotify API Credentials
        SPOTIFY_CLIENT_ID=444e698d82de4cb48611b3ae8507eae2
        SPOTIFY_CLIENT_SECRET=07c6997b1d334ca5abf65467fa4df602

        # Apple Music API Credentials
        APPLE_MUSIC_DEVELOPER_TOKEN=your_apple_music_developer_token_here

        # Musixmatch API Credentials
        MUSIXMATCH_API_KEY=your_musixmatch_api_key_here
        EOF

    - name: Install dependencies
      run: flutter pub get

    - name: Build Web
      run: flutter build web --release --base-href "/fifteen/"

    - name: Deploy to GitHub Pages
      uses: peaceiris/actions-gh-pages@v3
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        publish_dir: ./build/web
